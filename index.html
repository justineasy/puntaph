<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PUNTA — Beautiful places. Meaningful escapes. Discover stays across the Philippines: Palawan, Siargao, Batangas, Baguio, Cebu, La Union, Boracay and Tagaytay." />
    <meta name="theme-color" content="#141210" />
    <meta property="og:title" content="PUNTA — Where will you stay?" />
    <meta property="og:description" content="Beautiful places. Meaningful escapes. Discover stays across the Philippines: Palawan, Siargao, Batangas, Baguio, Cebu, La Union, Boracay and Tagaytay." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PUNTA — Where will you stay?" />
    <meta name="twitter:description" content="Beautiful places. Meaningful escapes. Discover stays across the Philippines." />
    <title>PUNTA — Where will you stay?</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://thumb.wikimedia.org" crossorigin />
    <!-- the LCP hero photograph — fetched before the bundle even loads -->
    <link rel="preload" as="image" href="https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/El_Nido_Bay%2C_Desert_tropical_island%2C_Coastline%2C_Palawan_Island%2C_Philippines.jpg/1920px-El_Nido_Bay%2C_Desert_tropical_island%2C_Coastline%2C_Palawan_Island%2C_Philippines.jpg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
         CRITICAL BOOT LOADER — deliberately inline.

         A hard refresh paints this before the bundle exists, so it can
         never flash an unstyled blank.

         It is a hand-minified copy of `.punta-loader--lg.punta-loader--dark`
         from src/components/system/skeletons.css, plus the same grain and
         vignette the Entry overlay draws. That match is the whole point:
         when React mounts, Entry's quick path renders the identical mark on
         the identical canvas, so the logo reads as ONE continuous loader
         from first paint to first page.

         ⚠  Change one, change the other.

         Three moves, all borrowed from the Entry cinematic:
           1. the wordmark SETTLES — wide and blurred, converging into place
           2. a warm capiz light PASSES through it, then rests
           3. a sun CROSSES a hairline horizon
         ============================================================ */

      html { background: #141210; }
      body { margin: 0; }

      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        overflow: hidden;
        background: radial-gradient(ellipse 120% 70% at 50% 46%, #221f19 0%, #141210 60%, #0e0d0b 100%);
        font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      }

      /* the same film grain the entry overlay carries — without it the
         texture would visibly change the instant React takes over */
      .boot-grain {
        position: absolute;
        inset: -50%;
        background-image: repeating-conic-gradient(
          rgba(244, 240, 232, 0.016) 0% 25%,
          transparent 0% 50%
        );
        background-size: 3px 3px;
        opacity: 0.5;
        pointer-events: none;
        animation: bootGrain 1.4s steps(4) infinite;
      }

      .boot-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 90% 75% at 50% 46%, transparent 40%, rgba(10, 9, 7, 0.55) 100%);
      }

      .boot-lockup {
        display: inline-flex;
        align-items: center;
        gap: 16px;
      }

      /* ————— the monogram ————— */

      .boot-tile {
        position: relative;
        overflow: hidden;
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: calc(48px * 0.28);
        background: #f4f0e8;
        color: #1c1a16;
        font-size: calc(48px * 0.54);
        font-weight: 500;
        line-height: 1;
      }

      /* capiz light — crosses, then rests before the next pass */
      .boot-tile::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(
          100deg,
          transparent 34%,
          rgba(216, 201, 174, 0.6) 50%,
          transparent 66%
        );
        animation: bootCapiz 2.6s cubic-bezier(0.33, 0, 0.2, 1) infinite;
      }

      /* ————— the wordmark ————— */

      .boot-word {
        font-size: 38px;
        font-weight: 500;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        line-height: 1;
        color: transparent;
        background-image: linear-gradient(
          100deg,
          rgba(244, 240, 232, 0.22) 42%,
          #f4f0e8 50%,
          rgba(244, 240, 232, 0.22) 58%
        );
        background-size: 300% 100%;
        background-position: 0% 0;
        background-clip: text;
        -webkit-background-clip: text;
        animation:
          bootSettle 1s cubic-bezier(0.16, 1, 0.3, 1) both,
          bootShimmer 2.6s cubic-bezier(0.33, 0, 0.2, 1) infinite;
      }

      /* ————— the horizon ————— */

      .boot-horizon {
        position: relative;
        overflow: hidden;
        width: min(190px, 46vw);
        height: 12px;
      }

      .boot-horizon::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
        transform: translateY(-50%);
        background: rgba(244, 240, 232, 0.16);
      }

      .boot-horizon::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 0;
        width: 42%;
        height: 1px;
        background: linear-gradient(90deg, transparent, #d8c9ae);
        box-shadow: 0 0 7px rgba(216, 201, 174, 0.5);
        animation: bootHorizon 2.6s cubic-bezier(0.33, 0, 0.2, 1) infinite;
      }

      .boot-tagline {
        font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(244, 240, 232, 0.6);
      }

      .boot-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes bootGrain {
        0% { transform: translate(0, 0); }
        25% { transform: translate(-2px, 1px); }
        50% { transform: translate(1px, -2px); }
        75% { transform: translate(-1px, 2px); }
        100% { transform: translate(0, 0); }
      }

      @keyframes bootCapiz {
        0% { transform: translateX(-100%); }
        55% { transform: translateX(100%); }
        100% { transform: translateX(100%); }
      }

      /* Tracking only — no filter/blur (the element carries
         background-clip: text, which a filter can drop in Safari) and no
         opacity (React restarts this animation on mount, and an opacity
         restart would snap the word back to invisible mid-converge). */
      @keyframes bootSettle {
        from {
          letter-spacing: 0.6em;
          text-indent: 0.6em;
        }
        to {
          letter-spacing: 0.42em;
          text-indent: 0.42em;
        }
      }

      @keyframes bootShimmer {
        0% { background-position: 0% 0; }
        55% { background-position: 100% 0; }
        100% { background-position: 100% 0; }
      }

      @keyframes bootHorizon {
        0% { transform: translate(-110%, -50%); }
        60% { transform: translate(250%, -50%); }
        100% { transform: translate(250%, -50%); }
      }

      /* Everything here sweeps, travels or converges — all of it stops. The
         mark simply sits, fully legible, with the sun parked at the centre
         of its horizon. */
      @media (prefers-reduced-motion: reduce) {
        .boot-grain { animation: none; }

        .boot-word {
          animation: none;
          background-image: none;
          color: #f4f0e8;
        }

        .boot-tile::after { display: none; }

        .boot-horizon::after {
          animation: none;
          left: 50%;
          width: 70%;
          transform: translate(-50%, -50%);
          background: linear-gradient(90deg, transparent, #d8c9ae, transparent);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced the moment React mounts. Every hard refresh gets the
           brand mark instead of a blank screen. -->
      <div class="boot" role="status">
        <div class="boot-grain" aria-hidden="true"></div>
        <div class="boot-vignette" aria-hidden="true"></div>

        <span class="boot-lockup" aria-hidden="true">
          <span class="boot-tile">P</span>
          <span class="boot-word">PUNTA</span>
        </span>
        <span class="boot-horizon" aria-hidden="true"></span>
        <span class="boot-tagline" aria-hidden="true">Where will you stay?</span>
        <span class="boot-sr">Loading PUNTA</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
